<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Funcionários | Escalas do posto</title>
    <link rel="stylesheet" th:href="@{/css/estilo.css}">
</head>
<body>
<header class="barra">
    <div class="conteudo barra-interna">
        <a class="marca" th:href="@{/}"><span class="marca-sinal">●</span> Escalas do posto</a>
        <nav><a th:href="@{/}">Escalas</a></nav>
    </div>
</header>
<main class="conteudo">
    <h1>Funcionários</h1>
    <p class="subtitulo">Defina quem poderá entrar nas próximas escalas.</p>
    <div class="alerta sucesso" th:if="${mensagem}" th:text="${mensagem}"></div>
    <section class="cartao">
        <h2>Novo funcionário</h2>
        <form th:action="@{/funcionarios}" th:object="${form}" method="post" class="form-linha">
            <label class="campo-nome">Nome
                <input type="text" th:field="*{nome}" maxlength="120" required autofocus>
                <small class="erro-texto" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></small>
            </label>
            <label>Status
                <select th:field="*{ativo}">
                    <option value="true">Ativo</option>
                    <option value="false">Inativo</option>
                </select>
            </label>
            <label>Função principal
                <select th:field="*{funcao}">
                    <option th:each="funcao : ${funcoes}" th:value="${funcao}" th:text="${funcao.descricao}"></option>
                </select>
            </label>
            <button type="submit">Cadastrar</button>
        </form>
    </section>
    <section class="cartao">
        <h2>Cadastrados</h2>
        <p th:if="${#lists.isEmpty(funcionarios)}">Nenhum funcionário cadastrado.</p>
        <div class="tabela-rolagem" th:unless="${#lists.isEmpty(funcionarios)}">
            <table class="tabela-simples">
                <thead><tr><th>Nome</th><th>Função</th><th>Status</th><th>Ação</th></tr></thead>
                <tbody>
                <tr th:each="funcionario : ${funcionarios}">
                    <td th:text="${funcionario.nome}">Nome</td>
                    <td th:text="${funcionario.funcao.descricao}">Função</td>
                    <td th:text="${funcionario.ativo ? 'Ativo' : 'Inativo'}">Status</td>
                    <td>
                        <form th:action="@{/funcionarios/{id}/alternar-status(id=${funcionario.id})}" method="post">
                            <button class="botao-secundario" type="submit" th:text="${funcionario.ativo ? 'Inativar' : 'Ativar'}">Alterar</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</main>
</body>
</html>
